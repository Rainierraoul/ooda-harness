[project]
name = "evolve"
version = "0.1.0"
description = "Evolution loop for the OODA harness: reads episodes, proposes genome changes, evaluates and promotes them."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evolve = "evolve.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
